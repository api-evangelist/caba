name: Caba
description: >-
  CABA Design Co. is a direct-to-consumer home-furnishings company building the
  next generation of furniture brands powered by community and technology. It
  develops sustainable, high-quality furniture and gives customers choice
  through customization and modularity, selling directly through its
  Shopify-hosted storefront at cabadesign.co under the tagline "Your Home. Your
  Way." Caba was surfaced as a portfolio lead and added to the API Evangelist
  network as a company stub; it publishes a consumer e-commerce storefront and
  does not currently expose a first-party developer API, SDK, or developer
  portal. This profile captures the identity, storefront, and domain/security
  posture verified during enrichment.
